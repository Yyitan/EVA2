model:
  model_name: EVA
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  n_routed: 8
  k: 2
  lora_r: 64
  alpha: 0.5
  lambda_1: 0.5
  lambda_2: 0.1

train:
  dataset: ut-zappos
  dataset_path: data/ut-zap50k
  lr: 0.0001
  weight_decay: 0.0005
  train_batch_size: 32
  epochs: 20
  context_length: 8
  seed: 0
  val_metric: AUC
  save_every_n: 5
  save_final_model: True
  save_path: output/eva_utzappos

test:
  open_world: false
  eval_batch_size: 32
  feasibility: feasibilities/feasibility_zp.pt
  threshold: 0.4705232256
  threshold_trials: 50
  beta: 0.5
  load_model: output/eva_utzappos/val_best.pt
